<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Linha do tempo — {{ MARCA_NOME }}</title>
  {% include "partials/marca_favicon.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='style/global_utils.css') }}" />
  <link rel="stylesheet" href="{{ url_for('config.static', filename='style/Cconfig_crud.css') }}" />
  <link rel="stylesheet" href="{{ url_for('config.static', filename='style/Cconfig_mala_direta.css') }}?v=8" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="CfgMd_ApoioBody">
  <div class="Cl_ContainerApoio CfgMd_ApoioWrap">
    <header class="CfgMd_ApoioHead">
      <div>
        <h2 id="md_ev_titulo">Linha do tempo</h2>
        <p class="CfgMd_Hint" id="md_ev_meta">Carregando…</p>
      </div>
      <button type="button" class="Cl_botaosecundario" id="md_ev_atualizar">Atualizar</button>
    </header>

    <div class="CfgMd_Timeline CfgMd_Timeline--apoio" id="md_ev_box">
      <ol class="CfgMd_TimelineList" id="md_ev_list">
        <li class="CfgMd_Hint">Carregando…</li>
      </ol>
    </div>

    <div class="Cl_BotoesApoio">
      <button type="button" class="Cl_BtnCancelar" id="md_ev_fechar">Fechar</button>
    </div>
  </div>

  <script id="md_ev_cfg" type="application/json">{{ {
    "idDestinatario": id_destinatario,
    "apiEventos": url_for("config.mala_direta_destinatario_eventos", id_destinatario=id_destinatario or 0)
  }|tojson }}</script>
  <script src="{{ url_for('static', filename='script/global_utils.js') }}"></script>
  <script src="{{ url_for('config.static', filename='script/Sconfig_mala_direta_evento_apoio.js') }}?v=1"></script>
</body>
</html>
