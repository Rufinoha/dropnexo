<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Log do e-mail — {{ MARCA_NOME }}</title>
  {% include "partials/marca_favicon.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='style/global_utils.css') }}" />
  <link rel="stylesheet" href="{{ url_for('config.static', filename='style/Cconfig_mala_direta.css') }}?v=5" />
  <script defer src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="CfgMd_ApoioBody">
  <div class="Cl_ContainerApoio CfgMd_Apoio">
    <div class="CfgMd_Timeline is-apoio" id="md_log_box">
      <div class="CfgMd_TimelineHead">
        <h4 id="md_log_titulo">Linha do tempo</h4>
      </div>
      <p class="CfgMd_Hint" id="md_log_meta"></p>
      <ol class="CfgMd_TimelineList" id="md_log_list">
        <li class="CfgMd_Hint">Carregando…</li>
      </ol>
    </div>
  </div>

  <script id="md_log_cfg" type="application/json">{{ {
    "apiEventos": url_for("config.mala_direta_destinatario_eventos", id_destinatario=0).replace("/0/eventos", "")
  }|tojson }}</script>
  <script src="{{ url_for('static', filename='script/global_utils.js') }}"></script>
  <script src="{{ url_for('config.static', filename='script/Sconfig_mala_direta_log_apoio.js') }}?v=1"></script>
</body>
</html>
