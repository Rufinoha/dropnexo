<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Academia DropNexo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style/global_utils.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='imge/icone_dropnexo.png') }}">
  <link rel="stylesheet" href="{{ url_for('academia.static', filename='style/Cacademia_player.css') }}?v=20260916a">
  <script defer src="{{ url_for('static', filename='script/global_utils.js') }}?v=20260528modal"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script defer src="{{ url_for('academia.static', filename='script/Sacademia_player.js') }}?v=20260916a"></script>
</head>
<body>
  <div class="ap-wrap" data-id-video="{{ id_video or 0 }}">
    <div class="ap-top">
      <div class="ap-titulo" id="ob_titulo">Carregando…</div>
      <div class="ap-acoes">
        <button type="button" class="ap-btn" id="ob_btnFullscreen">Tela cheia</button>
        <button type="button" class="ap-btn ap-btn-fechar" id="ob_btnFechar">Fechar</button>
      </div>
    </div>

    <div class="ap-grid">
      <section class="ap-player">
        <video id="ob_video" controls preload="metadata" playsinline></video>
        <div class="ap-desc">
          <div class="ap-modulo" id="ob_modulo">—</div>
          <div class="ap-descricao" id="ob_descricao">—</div>
        </div>
      </section>

      <aside class="ap-side">
        <div class="ap-side-title">Mais Vistos</div>
        <div id="ob_maisvistos"></div>
      </aside>
    </div>
  </div>
</body>
</html>
